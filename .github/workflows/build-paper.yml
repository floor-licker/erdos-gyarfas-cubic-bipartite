name: Build paper

"on":
  push:
    paths:
      - "paper/**"
      - "research/results/frontier_counts.tsv"
      - "research/results/v29_orbits.tsv"
      - "research/scripts/generate_report_tables.py"
      - "Makefile"
      - ".github/workflows/build-paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - "research/results/frontier_counts.tsv"
      - "research/results/v29_orbits.tsv"
      - "research/scripts/generate_report_tables.py"
      - "Makefile"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install --yes cm-super texlive-fonts-recommended texlive-latex-base texlive-latex-extra

      - name: Build the PDF
        run: make paper

      - name: Validate displayed counters
        run: make validate-paper-data

      - name: Validate generated paper files
        run: |
          git diff --exit-code -- paper/tables
          test -s paper/Tranquilli_2026_Erdos-Gyarfas_60-Vertex_Lower_Bound.pdf
