name: Reproduce exhaustive search

"on":
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system and Python requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang
          python -m pip install --requirement requirements.txt

      - name: Reproduce full-range counters and transcripts
        run: make reproduce-search

      - name: Reproduce all three frontier implementations
        run: make verify-v29

      - name: Run positive controls
        run: make verify-positive

      - name: Reproduce the independent genbg overlap
        run: make compare-genbg

      - name: Reproduce the superseded generation mode
        run: make verify-unreduced

      - name: Require deterministic tracked outputs
        run: git diff --exit-code
